services:
  # ============================================================
  # Bifrost AI Gateway
  # Web UI: http://<host>:${BIFROST_PORT}
  # API:    http://<host>:${BIFROST_PORT}/v1/chat/completions
  # ============================================================
  bifrost:
    image: maximhq/bifrost:latest
    platform: linux/amd64
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "${BIFROST_PORT:-8080}:8080"
    environment:
      APP_PORT: "8080"
      # Must be 0.0.0.0 in Docker — default 'localhost' makes the container unreachable
      APP_HOST: "0.0.0.0"
      # Log verbosity: debug | info | warn | error
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Log format: json | pretty
      LOG_STYLE: "${LOG_STYLE:-json}"
      # PostgreSQL credentials — referenced in config.json as env.VARNAME
      POSTGRES_HOST: "${POSTGRES_HOST:-global-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-bifrost}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_CONFIG_DB: "${POSTGRES_CONFIG_DB:-bifrost_config}"
      POSTGRES_LOGS_DB: "${POSTGRES_LOGS_DB:-bifrost_logs}"
      POSTGRES_SSLMODE: "disable"
    volumes:
      - ${DOCKER_DATA_PATH}/data:/app/data
    depends_on:
      global-postgres:
        condition: service_healthy
    networks:
      - bifrost-internal
      - postgres-network

networks:
  bifrost-internal:
    driver: bridge
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK_NAME:?POSTGRES_NETWORK_NAME must be set}
